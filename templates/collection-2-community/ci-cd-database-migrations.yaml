apiVersion: ops-box.io/v1
kind: AdoPipelineDefinition
metadata:
  name: ci-cd-database-migrations
  labels:
    ops-box.io/template: "true"
    ops-box.io/collection: "community"
    ops-box.io/template-type: "pipeline-template"
    ops-box.io/pattern: "ci-cd-database"
    ops-box.io/complexity: "advanced"
    ops-box.io/build-tool: "kaniko"
    ops-box.io/language: "any"
    ops-box.io/type: "singleService"
    ops-box.io/features: "database-migrations.flyway.liquibase.backup.rollback"
  annotations:
    description: |
      CI/CD pipeline with database migration management.
      Includes schema migration (Flyway/Liquibase), backup before deploy, rollback capability.
      Validates migrations in test environment before production.
      Ideal for services with database schema changes.
    ops-box.io/placeholders: '[{"name":"PIPELINE_NAME","wizardStep":"project","displayName":"Pipeline Name","description":"Unique name for the pipeline","required":true,"scope":"global"},{"name":"OB_SOURCE_GIT_DEFINITION","wizardStep":"ci","displayName":"Source Repository","description":"GitDefinition name for source code (auto-filled from wizard)","required":true,"scope":"global","crField":"spec.sourceRepository.gitDefinitionName"},{"name":"OB_TEMPLATES_GIT_DEFINITION","wizardStep":"ci","displayName":"Templates Repository","description":"GitDefinition name for pipeline templates (auto-filled from wizard)","required":true,"scope":"global","crField":"spec.templatesSource.gitDefinitionName"},{"name":"TEMPLATES_BASE_PATH","wizardStep":"ci","displayName":"Templates Base Path","description":"Base path in templates repository","required":false,"scope":"global"},{"name":"OB_TRIGGER_BRANCHES","wizardStep":"ci","displayName":"Trigger Branches","description":"Branches that trigger pipeline (comma-separated) (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.ciConfig.trigger.branches.include"},{"name":"OB_BUILD_COMMAND","wizardStep":"ci","displayName":"Build Command","description":"Command to build the application (auto-filled from wizard)","required":true,"scope":"per-service","crField":"spec.sourceRepository.services[].buildCommand"},{"name":"OB_TEST_COMMAND","wizardStep":"ci","displayName":"Test Command","description":"Command to run tests (auto-filled from wizard)","required":true,"scope":"per-service","crField":"spec.sourceRepository.services[].testCommand"},{"name":"MIGRATION_TOOL","wizardStep":"cd","displayName":"Migration Tool","description":"Database migration tool (flyway, liquibase, alembic)","required":true,"scope":"global"},{"name":"MIGRATION_PATH","wizardStep":"cd","displayName":"Migration Scripts Path","description":"Path to migration scripts","required":false,"scope":"global"},{"name":"DB_CONNECTION_STRING","wizardStep":"cd","displayName":"Database Connection String","description":"Database connection string (use secrets)","required":true,"scope":"global"},{"name":"BACKUP_ENABLED","wizardStep":"cd","displayName":"Enable Backup","description":"Enable database backup before migration","required":false,"scope":"global"},{"name":"BACKUP_RETENTION_DAYS","wizardStep":"cd","displayName":"Backup Retention Days","description":"Number of days to retain backups","required":false,"scope":"global"},{"name":"OB_DOCKERFILE_PATH","wizardStep":"ci","displayName":"Dockerfile Path","description":"Path to Dockerfile (auto-filled from wizard)","required":false,"scope":"per-service","crField":"spec.sourceRepository.services[].dockerfilePath"},{"name":"OB_CONTAINER_REGISTRY","wizardStep":"ci","displayName":"Container Registry","description":"Container registry URL (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.buildConfig.containerRegistry"},{"name":"OB_PROJECT_NAME","wizardStep":"project","displayName":"Project Name","description":"Project name for image tagging (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.projectSetup.projectName"},{"name":"OB_SERVICE_NAME","wizardStep":"ci","displayName":"Service Name","description":"Service name for image tagging (auto-filled from wizard)","required":false,"scope":"per-service","crField":"spec.sourceRepository.services[].name"},{"name":"DEPLOY_ENVIRONMENT","wizardStep":"cd","displayName":"Deployment Environment","description":"Target environment (dev, staging, prod)","required":true,"scope":"global"},{"name":"CLUSTER_DEFINITION","wizardStep":"cd","displayName":"Cluster Definition","description":"ClusterDefinition name for deployment","required":true,"scope":"global"},{"name":"HELM_CHART_PATH","wizardStep":"cd","displayName":"Helm Chart Path","description":"Path to Helm chart","required":false,"scope":"global"},{"name":"OB_OUTPUT_GIT_DEFINITION","wizardStep":"output","displayName":"Output Repository","description":"GitDefinition name for pipeline output","required":true,"scope":"global","type":"gitdefinition","gitPurpose":"output","crField":"spec.outputs.pipeline.gitDefinitionName"}]'
spec:
  draft: false
  sourceRepository:
    gitDefinitionName: "{{OB_SOURCE_GIT_DEFINITION}}"
  templatesSource:
    gitDefinitionName: "{{OB_TEMPLATES_GIT_DEFINITION}}"
    basePath: "{{TEMPLATES_BASE_PATH}}"
  pipelineDefinition:
    name: "{{PIPELINE_NAME}}"
    trigger:
      branches:
        include: "{{OB_TRIGGER_BRANCHES}}"
    pool:
      vmImage: ubuntu-latest
    variables:
      - name: containerRegistry
        value: "{{OB_CONTAINER_REGISTRY}}"
      - name: projectName
        value: "{{OB_PROJECT_NAME}}"
      - name: serviceName
        value: "{{OB_SERVICE_NAME}}"
      - name: deployEnvironment
        value: "{{DEPLOY_ENVIRONMENT}}"
      - name: migrationTool
        value: "{{MIGRATION_TOOL}}"
      - name: dbConnectionString
        value: "{{DB_CONNECTION_STRING}}"
    resources:
      repositories:
        - repository: adoRepository
          type: git
          name: "{{OB_TEMPLATES_GIT_DEFINITION}}"
    stages:
      # Stage 1: Build and Test
      - stage: Build
        displayName: "Build and Test"
        jobs:
          - job: BuildTestJob
            displayName: "Build & Test"
            steps:
              - checkout: self
                displayName: "Checkout Source Code"
              - task: Bash@3
                displayName: "Build Application"
                inputs:
                  targetType: inline
                  script: "{{OB_BUILD_COMMAND}}"
              - task: Bash@3
                displayName: "Run Tests"
                inputs:
                  targetType: inline
                  script: "{{OB_TEST_COMMAND}}"
              - task: PublishTestResults@2
                displayName: "Publish Test Results"
                condition: succeededOrFailed()
                inputs:
                  testResultsFiles: "**/test-results.xml"
                  testRunTitle: "Unit Tests"
      # Stage 2: Validate Migrations
      - stage: ValidateMigrations
        displayName: "Validate Database Migrations"
        dependsOn: Build
        condition: succeeded()
        jobs:
          - job: ValidateMigrationsJob
            displayName: "Validate Migrations"
            steps:
              - checkout: self
                displayName: "Checkout Source Code"
              - task: Bash@3
                displayName: "Install Migration Tool"
                inputs:
                  targetType: inline
                  script: |
                    case "$(migrationTool)" in
                      flyway)
                        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
                        sudo ln -s $(pwd)/flyway-9.22.0/flyway /usr/local/bin/flyway
                        ;;
                      liquibase)
                        curl -L https://github.com/liquibase/liquibase/releases/download/v4.24.0/liquibase-4.24.0.tar.gz | tar xvz
                        sudo mv liquibase /usr/local/bin/
                        ;;
                      alembic)
                        pip install alembic psycopg2-binary
                        ;;
                    esac
              - task: Bash@3
                displayName: "Validate Migration Scripts"
                inputs:
                  targetType: inline
                  script: |
                    case "$(migrationTool)" in
                      flyway)
                        flyway validate -locations=filesystem:{{MIGRATION_PATH}} -url=$(dbConnectionString)
                        ;;
                      liquibase)
                        liquibase --changeLogFile={{MIGRATION_PATH}}/changelog.xml --url=$(dbConnectionString) validate
                        ;;
                      alembic)
                        cd {{MIGRATION_PATH}}
                        alembic check
                        ;;
                    esac
      # Stage 3: Docker Build
      - stage: DockerBuild
        displayName: "Build Docker Image"
        dependsOn: ValidateMigrations
        condition: succeeded()
        jobs:
          - job: DockerBuildJob
            displayName: "Kaniko Build & Push"
            steps:
              - checkout: self
                displayName: "Checkout Source Code"
              - task: setVars
                displayName: "Set Build Variables"
                vars:
                  service: "$(serviceName)"
                  acrRepoName: "$(projectName)"
                  dockerFile: "{{OB_DOCKERFILE_PATH}}"
                  imageTag: "$(containerRegistry)/$(projectName)/$(serviceName):$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
                  context: "$(Build.SourcesDirectory)"
                  containerRegistryFullName: "$(containerRegistry)"
                injectScript: "templates/variables/cde-vars-build-conditions.yml"
              - task: injectScript
                displayName: "Create build-info.json"
                scriptPath: "templates/scripts/create_build_info.sh"
              - task: injectScript
                displayName: "Kaniko Build & Push"
                scriptPath: "templates/scripts/kaniko_build_push.sh"
      # Stage 4: Database Backup
      - stage: DatabaseBackup
        displayName: "Backup Database"
        dependsOn: DockerBuild
        condition: and(succeeded(), eq('{{BACKUP_ENABLED}}', 'true'))
        jobs:
          - job: BackupJob
            displayName: "Create Database Backup"
            steps:
              - task: Bash@3
                displayName: "Create Database Backup"
                inputs:
                  targetType: inline
                  script: |
                    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                    BACKUP_FILE="backup_$(serviceName)_${TIMESTAMP}.sql"

                    # Extract database type from connection string
                    if [[ $(dbConnectionString) == *"postgresql"* ]]; then
                      pg_dump $(dbConnectionString) > $(Build.ArtifactStagingDirectory)/$BACKUP_FILE
                    elif [[ $(dbConnectionString) == *"mysql"* ]]; then
                      mysqldump --host=<host> --user=<user> --password=<pass> <db> > $(Build.ArtifactStagingDirectory)/$BACKUP_FILE
                    fi

                    echo "Backup created: $BACKUP_FILE"
              - task: PublishPipelineArtifact@1
                displayName: "Publish Backup"
                inputs:
                  targetPath: "$(Build.ArtifactStagingDirectory)"
                  artifact: "database-backup-$(Build.BuildId)"
                  publishLocation: pipeline
              - task: Bash@3
                displayName: "Upload Backup to Storage"
                inputs:
                  targetType: inline
                  script: |
                    # Upload to cloud storage (Azure Blob, S3, etc.)
                    echo "Uploading backup to cloud storage..."
                    # az storage blob upload or aws s3 cp
      # Stage 5: Run Migrations
      - stage: RunMigrations
        displayName: "Run Database Migrations"
        dependsOn: DatabaseBackup
        condition: succeeded()
        jobs:
          - job: MigrationJob
            displayName: "Execute Migrations"
            steps:
              - checkout: self
                displayName: "Checkout Source Code"
              - task: Bash@3
                displayName: "Install Migration Tool"
                inputs:
                  targetType: inline
                  script: |
                    case "$(migrationTool)" in
                      flyway)
                        curl -L https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/9.22.0/flyway-commandline-9.22.0-linux-x64.tar.gz | tar xvz
                        sudo ln -s $(pwd)/flyway-9.22.0/flyway /usr/local/bin/flyway
                        ;;
                      liquibase)
                        curl -L https://github.com/liquibase/liquibase/releases/download/v4.24.0/liquibase-4.24.0.tar.gz | tar xvz
                        sudo mv liquibase /usr/local/bin/
                        ;;
                      alembic)
                        pip install alembic psycopg2-binary
                        ;;
                    esac
              - task: Bash@3
                displayName: "Run Migrations"
                inputs:
                  targetType: inline
                  script: |
                    case "$(migrationTool)" in
                      flyway)
                        flyway migrate -locations=filesystem:{{MIGRATION_PATH}} -url=$(dbConnectionString)
                        ;;
                      liquibase)
                        liquibase --changeLogFile={{MIGRATION_PATH}}/changelog.xml --url=$(dbConnectionString) update
                        ;;
                      alembic)
                        cd {{MIGRATION_PATH}}
                        alembic upgrade head
                        ;;
                    esac
              - task: Bash@3
                displayName: "Verify Migration Status"
                inputs:
                  targetType: inline
                  script: |
                    case "$(migrationTool)" in
                      flyway)
                        flyway info -locations=filesystem:{{MIGRATION_PATH}} -url=$(dbConnectionString)
                        ;;
                      liquibase)
                        liquibase --changeLogFile={{MIGRATION_PATH}}/changelog.xml --url=$(dbConnectionString) status
                        ;;
                      alembic)
                        cd {{MIGRATION_PATH}}
                        alembic current
                        ;;
                    esac
      # Stage 6: Deploy Application
      - stage: Deploy
        displayName: "Deploy to {{DEPLOY_ENVIRONMENT}}"
        dependsOn: RunMigrations
        condition: succeeded()
        jobs:
          - job: DeployJob
            displayName: "Helm Deploy"
            steps:
              - checkout: self
                displayName: "Checkout Source Code"
              - task: injectScript
                displayName: "Deploy via Helm"
                scriptPath: "templates/scripts/helm_deploy.sh"
                vars:
                  clusterDefinition: "{{CLUSTER_DEFINITION}}"
                  environment: "$(deployEnvironment)"
                  helmChartPath: "{{HELM_CHART_PATH}}"
                  imageName: "$(containerRegistry)/$(projectName)/$(serviceName)"
                  imageTag: "$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
              - task: Bash@3
                displayName: "Verify Deployment"
                inputs:
                  targetType: inline
                  script: |
                    echo "Waiting for application to be ready..."
                    sleep 30
                    # Add health check logic
      # Stage 7: Cleanup Old Backups
      - stage: CleanupBackups
        displayName: "Cleanup Old Backups"
        dependsOn: Deploy
        condition: and(succeeded(), ne('{{BACKUP_RETENTION_DAYS}}', ''))
        jobs:
          - job: CleanupJob
            displayName: "Remove Old Backups"
            steps:
              - task: Bash@3
                displayName: "Delete Backups Older Than {{BACKUP_RETENTION_DAYS}} Days"
                inputs:
                  targetType: inline
                  script: |
                    RETENTION_DAYS={{BACKUP_RETENTION_DAYS}}
                    echo "Cleaning up backups older than $RETENTION_DAYS days..."
                    # Cloud storage cleanup command
                    # az storage blob delete-batch or aws s3 rm with --older-than filter
