apiVersion: ops-box.io/v1
kind: AdoPipelineDefinition
metadata:
  name: ci-cd-sonarqube-quality-gate
  labels:
    ops-box.io/template: "true"
    ops-box.io/collection: "community"
    ops-box.io/template-type: "pipeline-template"
    ops-box.io/pattern: "ci-cd-quality"
    ops-box.io/complexity: "advanced"
    ops-box.io/build-tool: "kaniko"
    ops-box.io/language: "any"
    ops-box.io/type: "singleService"
    ops-box.io/features: "sonarqube.code-quality.quality-gate"
  annotations:
    description: |
      Advanced CI/CD pipeline with SonarQube integration and quality gates.
      Performs static code analysis, enforces quality gates before deployment.
      Includes build, test, SonarQube scan, quality gate check, Docker build, and deployment.
      Ideal for projects requiring code quality enforcement.
    ops-box.io/placeholders: '[{"name":"PIPELINE_NAME","wizardStep":"project","displayName":"Pipeline Name","description":"Unique name for the pipeline","required":true,"scope":"global"},{"name":"OB_SOURCE_GIT_DEFINITION","wizardStep":"ci","displayName":"Source Repository","description":"GitDefinition name for source code (auto-filled from wizard)","required":true,"scope":"global","crField":"spec.sourceRepository.gitDefinitionName"},{"name":"OB_TEMPLATES_GIT_DEFINITION","wizardStep":"ci","displayName":"Templates Repository","description":"GitDefinition name for pipeline templates (auto-filled from wizard)","required":true,"scope":"global","crField":"spec.templatesSource.gitDefinitionName"},{"name":"TEMPLATES_BASE_PATH","wizardStep":"ci","displayName":"Templates Base Path","description":"Base path in templates repository","required":false,"scope":"global"},{"name":"OB_TRIGGER_BRANCHES","wizardStep":"ci","displayName":"Trigger Branches","description":"Branches that trigger pipeline (comma-separated) (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.ciConfig.trigger.branches.include"},{"name":"OB_BUILD_COMMAND","wizardStep":"ci","displayName":"Build Command","description":"Command to build the application (auto-filled from wizard)","required":true,"scope":"per-service","crField":"spec.sourceRepository.services[].buildCommand"},{"name":"OB_TEST_COMMAND","wizardStep":"ci","displayName":"Test Command","description":"Command to run tests with coverage (auto-filled from wizard)","required":true,"scope":"per-service","crField":"spec.sourceRepository.services[].testCommand"},{"name":"SONARQUBE_PROJECT_KEY","wizardStep":"tests","displayName":"SonarQube Project Key","description":"SonarQube project key for analysis","required":true,"scope":"global"},{"name":"SONARQUBE_SERVER","wizardStep":"tests","displayName":"SonarQube Server","description":"SonarQube server URL","required":false,"scope":"global"},{"name":"COVERAGE_THRESHOLD","wizardStep":"tests","displayName":"Coverage Threshold","description":"Minimum code coverage percentage","required":false,"scope":"global"},{"name":"QUALITY_GATE_TIMEOUT","wizardStep":"tests","displayName":"Quality Gate Timeout","description":"Timeout for quality gate check (minutes)","required":false,"scope":"global"},{"name":"OB_DOCKERFILE_PATH","wizardStep":"ci","displayName":"Dockerfile Path","description":"Path to Dockerfile (auto-filled from wizard)","required":false,"scope":"per-service","crField":"spec.sourceRepository.services[].dockerfilePath"},{"name":"OB_CONTAINER_REGISTRY","wizardStep":"ci","displayName":"Container Registry","description":"Container registry URL (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.buildConfig.containerRegistry"},{"name":"OB_PROJECT_NAME","wizardStep":"project","displayName":"Project Name","description":"Project name for image tagging (auto-filled from wizard)","required":false,"scope":"global","crField":"spec.projectSetup.projectName"},{"name":"OB_SERVICE_NAME","wizardStep":"ci","displayName":"Service Name","description":"Service name for image tagging (auto-filled from wizard)","required":false,"scope":"per-service","crField":"spec.sourceRepository.services[].name"},{"name":"DEPLOY_ENVIRONMENT","wizardStep":"cd","displayName":"Deployment Environment","description":"Target environment (dev, staging, prod)","required":true,"scope":"global"},{"name":"CLUSTER_DEFINITION","wizardStep":"cd","displayName":"Cluster Definition","description":"ClusterDefinition name for deployment","required":true,"scope":"global"},{"name":"HELM_CHART_PATH","wizardStep":"cd","displayName":"Helm Chart Path","description":"Path to Helm chart","required":false,"scope":"global"},{"name":"OB_OUTPUT_GIT_DEFINITION","wizardStep":"output","displayName":"Output Repository","description":"GitDefinition name for pipeline output","required":true,"scope":"global","type":"gitdefinition","gitPurpose":"output","crField":"spec.outputs.pipeline.gitDefinitionName"}]'
spec:
  draft: false
  sourceRepository:
    gitDefinitionName: "{{OB_SOURCE_GIT_DEFINITION}}"
  templatesSource:
    gitDefinitionName: "{{OB_TEMPLATES_GIT_DEFINITION}}"
    basePath: "{{TEMPLATES_BASE_PATH}}"
  pipelineDefinition:
    name: "{{PIPELINE_NAME}}"
    trigger:
      branches:
        include: "{{OB_TRIGGER_BRANCHES}}"
    pool:
      vmImage: ubuntu-latest
    variables:
      - name: containerRegistry
        value: "{{OB_CONTAINER_REGISTRY}}"
      - name: projectName
        value: "{{OB_PROJECT_NAME}}"
      - name: serviceName
        value: "{{OB_SERVICE_NAME}}"
      - name: sonarQubeProjectKey
        value: "{{SONARQUBE_PROJECT_KEY}}"
      - name: sonarQubeServer
        value: "{{SONARQUBE_SERVER}}"
      - name: deployEnvironment
        value: "{{DEPLOY_ENVIRONMENT}}"
    resources:
      repositories:
        - repository: adoRepository
          type: git
          name: "{{OB_TEMPLATES_GIT_DEFINITION}}"
    stages:
      # Stage 1: Build and Test with Coverage
      - stage: Build
        displayName: "Build and Test with Coverage"
        jobs:
          - job: BuildTestJob
            displayName: "Build & Test"
            steps:
              # Step 1: Checkout source code
              - checkout: self
                displayName: "Checkout Source Code"
              # Step 2: Run build command
              - task: Bash@3
                displayName: "Build Application"
                inputs:
                  targetType: inline
                  script: "{{OB_BUILD_COMMAND}}"
              # Step 3: Run tests with coverage
              - task: Bash@3
                displayName: "Run Tests with Coverage"
                inputs:
                  targetType: inline
                  script: "{{OB_TEST_COMMAND}}"
              # Step 4: Publish test results
              - task: PublishTestResults@2
                displayName: "Publish Test Results"
                condition: succeededOrFailed()
                inputs:
                  testResultsFiles: "**/test-results.xml"
                  testRunTitle: "Unit Tests"
              # Step 5: Publish code coverage
              - task: PublishCodeCoverageResults@1
                displayName: "Publish Code Coverage"
                condition: succeededOrFailed()
                inputs:
                  codeCoverageTool: "Cobertura"
                  summaryFileLocation: "**/coverage/cobertura-coverage.xml"
              # Step 6: Check coverage threshold
              - task: Bash@3
                displayName: "Check Coverage Threshold"
                condition: ne('{{COVERAGE_THRESHOLD}}', '')
                inputs:
                  targetType: inline
                  script: |
                    THRESHOLD={{COVERAGE_THRESHOLD}}
                    ACTUAL=$(grep -oP 'line-rate="\K[^"]+' coverage/cobertura-coverage.xml | head -1)
                    ACTUAL_PCT=$(echo "$ACTUAL * 100" | bc)
                    if (( $(echo "$ACTUAL_PCT < $THRESHOLD" | bc -l) )); then
                      echo "Coverage $ACTUAL_PCT% is below threshold $THRESHOLD%"
                      exit 1
                    fi
                    echo "Coverage $ACTUAL_PCT% meets threshold $THRESHOLD%"
      # Stage 2: SonarQube Analysis
      - stage: CodeQuality
        displayName: "Code Quality Analysis"
        dependsOn: Build
        condition: succeeded()
        jobs:
          - job: SonarQubeJob
            displayName: "SonarQube Scan"
            steps:
              # Step 1: Checkout source code
              - checkout: self
                displayName: "Checkout Source Code"
              # Step 2: Download coverage results
              - task: DownloadPipelineArtifact@2
                displayName: "Download Coverage Results"
                inputs:
                  artifactName: "Code Coverage Report_*"
                  targetPath: "coverage"
              # Step 3: Prepare SonarQube
              - task: SonarQubePrepare@5
                displayName: "Prepare SonarQube Analysis"
                inputs:
                  SonarQube: "SonarQubeServiceConnection"
                  scannerMode: "CLI"
                  configMode: "manual"
                  cliProjectKey: "$(sonarQubeProjectKey)"
                  cliProjectName: "$(serviceName)"
                  cliSources: "."
                  extraProperties: |
                    sonar.host.url=$(sonarQubeServer)
                    sonar.coverage.exclusions=**/*test*/**,**/tests/**
                    sonar.python.coverage.reportPaths=coverage/cobertura-coverage.xml
              # Step 4: Run SonarQube analysis
              - task: SonarQubeAnalyze@5
                displayName: "Run SonarQube Analysis"
              # Step 5: Publish quality gate result
              - task: SonarQubePublish@5
                displayName: "Publish Quality Gate Result"
                inputs:
                  pollingTimeoutSec: "{{QUALITY_GATE_TIMEOUT}}"
              # Step 6: Check quality gate
              - task: Bash@3
                displayName: "Check Quality Gate Status"
                inputs:
                  targetType: inline
                  script: |
                    STATUS=$(cat $(Build.StagingDirectory)/sonar/report-task.txt | grep ceTaskUrl | cut -d'=' -f2)
                    echo "Quality Gate Status: $STATUS"
                    # Script will fail if quality gate fails
      # Stage 3: Docker Build (only if quality gate passes)
      - stage: DockerBuild
        displayName: "Build Docker Image"
        dependsOn: CodeQuality
        condition: succeeded()
        jobs:
          - job: DockerBuildJob
            displayName: "Kaniko Build & Push"
            steps:
              # Step 1: Checkout source code
              - checkout: self
                displayName: "Checkout Source Code"
              # Step 2: Set build variables
              - task: setVars
                displayName: "Set Build Variables"
                vars:
                  service: "$(serviceName)"
                  acrRepoName: "$(projectName)"
                  dockerFile: "{{OB_DOCKERFILE_PATH}}"
                  imageTag: "$(containerRegistry)/$(projectName)/$(serviceName):$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
                  context: "$(Build.SourcesDirectory)"
                  containerRegistryFullName: "$(containerRegistry)"
                injectScript: "templates/variables/cde-vars-build-conditions.yml"
              # Step 3: Create build-info.json
              - task: injectScript
                displayName: "Create build-info.json"
                scriptPath: "templates/scripts/create_build_info.sh"
              # Step 4: Kaniko build and push
              - task: injectScript
                displayName: "Kaniko Build & Push"
                scriptPath: "templates/scripts/kaniko_build_push.sh"
      # Stage 4: Deploy (only if Docker build succeeds)
      - stage: Deploy
        displayName: "Deploy to {{DEPLOY_ENVIRONMENT}}"
        dependsOn: DockerBuild
        condition: succeeded()
        jobs:
          - job: DeployJob
            displayName: "Helm Deploy"
            steps:
              # Step 1: Checkout source code
              - checkout: self
                displayName: "Checkout Source Code"
              # Step 2: Inject Helm deploy script
              - task: injectScript
                displayName: "Deploy via Helm"
                scriptPath: "templates/scripts/helm_deploy.sh"
                vars:
                  clusterDefinition: "{{CLUSTER_DEFINITION}}"
                  environment: "$(deployEnvironment)"
                  helmChartPath: "{{HELM_CHART_PATH}}"
                  imageName: "$(containerRegistry)/$(projectName)/$(serviceName)"
                  imageTag: "$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
