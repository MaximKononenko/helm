job: kaniko_build_{{OB_SERVICE_NAME}}
displayName: Kaniko Build & Push {{OB_SERVICE_NAME}} (Java/Maven)
variables:
  - name: serviceName
    value: "{{OB_SERVICE_NAME}}"
  - name: dockerFile
    value: "{{OB_SERVICE_DOCKERFILE}}"
  - name: context
    value: "{{OB_SERVICE_CONTEXT}}"
  - name: artifactsPath
    value: "{{OB_SERVICE_ARTIFACTS_PATH}}"
  - name: buildCommand
    value: "{{OB_SERVICE_BUILD_COMMAND}}"
  - name: testCommand
    value: "{{OB_SERVICE_TEST_COMMAND}}"
steps:
  - task: Bash@3
    displayName: Set Build Variables
    name: buildVars
    inputs:
      targetType: inline
      script: |-
        service="$(serviceName)"
        echo "##vso[task.setvariable variable=service;isOutput=false]$service"

        acrRepoName="$(projectName)"
        echo "##vso[task.setvariable variable=acrRepoName;isOutput=false]$acrRepoName"

        dockerFile="$(dockerFile)"
        echo "##vso[task.setvariable variable=dockerFile;isOutput=false]$dockerFile"

        buildTag="$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
        echo "##vso[task.setvariable variable=buildTag;isOutput=true]$buildTag"

        serviceNameLower="$(echo $(serviceName) | tr '[:upper:]' '[:lower:]')"
        imageTag="$(containerRegistryFullName)/$(projectName)/$serviceNameLower:$buildTag"
        echo "##vso[task.setvariable variable=imageTag;isOutput=false]$imageTag"

        # Extract service root directory (remove /src suffix if present)
        serviceRoot="$(echo $(context) | sed 's#/src$##')"
        echo "##vso[task.setvariable variable=serviceRoot;isOutput=false]$serviceRoot"

        # Use artifactsPath as Kaniko context, default to serviceRoot/target if empty
        if [ -z "$(artifactsPath)" ]; then
          kanikoContext="$serviceRoot/target"
        else
          kanikoContext="$(artifactsPath)"
        fi
        echo "##vso[task.setvariable variable=kanikoContext;isOutput=false]$kanikoContext"

        echo "=== Build Variables (Java/Maven) ==="
        echo "service: $service"
        echo "acrRepoName: $acrRepoName"
        echo "dockerFile: $dockerFile"
        echo "buildTag: $buildTag"
        echo "imageTag: $imageTag"
        echo "context: $(context)"
        echo "artifactsPath: $(artifactsPath)"
        echo "kanikoContext: $kanikoContext"
  - task: Bash@3
    displayName: Custom Build Command
    condition: ne(variables['buildCommand'], '')
    inputs:
      targetType: inline
      workingDirectory: $(Build.SourcesDirectory)/$(serviceRoot)
      script: |
        echo "Running custom build command for $(serviceName)"
        echo "Build output will be stored in: $(kanikoContext)"
        $(buildCommand)
  - task: Bash@3
    displayName: Maven Build & Package (Default)
    condition: eq(variables['buildCommand'], '')
    inputs:
      targetType: inline
      workingDirectory: $(Build.SourcesDirectory)/$(serviceRoot)
      script: |
        echo "Building Java/Maven service: $(serviceName)"
        echo "Build output will be stored in: $(kanikoContext)"
        mvn clean package -DskipTests -T 1C -Duser.timezone=UTC
  - task: Bash@3
    displayName: Custom Test Command
    condition: ne(variables['testCommand'], '')
    inputs:
      targetType: inline
      workingDirectory: $(Build.SourcesDirectory)/$(serviceRoot)
      script: |
        echo "Running custom test command for $(serviceName)"
        $(testCommand)
  - task: Bash@3
    displayName: Maven Test (Default)
    condition: and(eq(variables['testCommand'], ''), eq(variables['buildCommand'], ''))
    inputs:
      targetType: inline
      workingDirectory: $(Build.SourcesDirectory)/$(serviceRoot)
      script: |
        echo "Running tests for Java/Maven service: $(serviceName)"
        mvn test -T 1C -Duser.timezone=UTC
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '1.17'
      mavenVersionOption: 'Default'
  - task: Bash@3
    displayName: Kaniko Build & Push (Java/Maven)
    inputs:
      targetType: inline
      script: |
        echo "Running Kaniko Build & Push for Java/Maven service: $(serviceName)"
        mkdir -p $(Pipeline.Workspace)/.kaniko-docker
        echo "{\"auths\":{\"$(containerRegistryFullName)\":{\"username\":\"$(global.acrUsername)\",\"password\":\"$(global.acrPasswd)\"}}}" > $(Pipeline.Workspace)/.kaniko-docker/config.json

        docker login $(containerRegistryFullName) -u $(global.acrUsername) -p $(global.acrPasswd)
        docker pull $(containerRegistryFullName)/kaniko/executor:latest

        echo "Starting Kaniko build with Dockerfile: $(dockerFile)"
        echo "Kaniko context (artifacts): $(kanikoContext)"
        docker run --rm \
          -v $(Pipeline.Workspace)/s:/workspace \
          -v $(Pipeline.Workspace)/.kaniko-docker:/kaniko/.docker \
          $(containerRegistryFullName)/kaniko/executor:v1.23.1 \
          --context=$(kanikoContext) \
          --dockerfile=$(dockerFile) \
          --destination=$(imageTag)
    name: kanikoOutput
