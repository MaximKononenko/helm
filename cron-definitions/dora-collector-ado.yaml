apiVersion: ops-box.io/v1
kind: CronDefinition
metadata:
  name: dora-collector-ado
  namespace: ops-box
spec:
  jobType: custom
  schedule: "*/15 * * * *"
  namespace: ops-box
  customJob:
    image: catalina.azurecr.io/ops-box/services-dora-collector:v5.1.0
    command: ["python", "-m", "dora_collector"]
    args: ["--run", "--provider", "ado"]
    env:
      - name: POSTGRES_HOST
        value: "ops-box-postgres"
      - name: POSTGRES_PORT
        value: "5432"
      - name: POSTGRES_DB
        value: "opsbox_dora"
      - name: POSTGRES_POOL_MIN
        value: "1"
      - name: POSTGRES_POOL_MAX
        value: "3"
      - name: REDIS_HOST
        value: "ops-box-redis"
      - name: REDIS_PORT
        value: "6379"
      - name: ADO_ORG
        value: "catalinamarketing"
      - name: K8S_NAMESPACE
        value: "ops-box"
      - name: CLUSTER_NAME
        value: "aks-prd-eastus2-mngmnt"
      - name: POSTGRES_USER
        valueFrom:
          secretKeyRef:
            name: k8s-ops-box-secrets
            key: postgresUser
      - name: POSTGRES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: k8s-ops-box-secrets
            key: postgresPassword
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: k8s-ops-box-secrets
            key: redisPassword
      - name: adoPat
        valueFrom:
          secretKeyRef:
            name: k8s-ops-box-secrets
            key: adoPat
  jobConfig:
    serviceAccountName: dora-collector
    concurrencyPolicy: Forbid
    backoffLimit: 2
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  reconciliation:
    selfHeal: true
    prune: true
