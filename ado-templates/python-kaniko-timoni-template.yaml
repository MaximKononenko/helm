apiVersion: ops-box.io/v1
kind: AdoPipelineDefinition
metadata:
  name: ado-pipeline-python-kaniko-timoni
  namespace: ops-box
  labels:
    ops-box.io/template: "true"
    ops-box.io/language: "python"
    ops-box.io/build-tool: "kaniko"
    ops-box.io/deploy-tool: "timoni"
    ops-box.io/repo-type: "single-service"
  annotations:
    ops-box.io/display-name: "Python Microservice CI/CD (Kaniko + Timoni)"
    ops-box.io/description: "CI/CD pipeline for single-service Python microservices with Kaniko builds and Timoni deployments"
    # ops-box.io/job-templates: Not used - using baseTemplate reference instead
    # ops-box.io/job-templates: |
    #   {
    #     "Build": {
    #       "python": "templates/jobs/kaniko-python-build.yml"
    #     }
    #   }
    # Deployment Artifacts Templates (V2 refactoring - structured annotation)
    # IMPORTANT: Avoid setting default value for "fieldId": "adoAgentPool" here to allow 
    # wizard override. It affects auto-detection logic for application self-service wizard.
    # With emptu value it will auto-detect based on ADO project using lookup table. But you
    # can still override it manually.
    ops-box.io/template-config: |
      {
        "wizard_config": {
          "steps": {
            "project": {
              "title": "Project Setup",
              "fields": [
                {
                  "fieldId": "projectName",
                  "type": "string",
                  "displayName": "Project Name",
                  "description": "Project name for resource grouping",
                  "required": true,
                  "validation": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
                  "minLength": 3,
                  "maxLength": 63,
                  "placeholder": "my-project",
                  "default": "app-01",
                  "helpUrl": "https://docs.ops-box.io/projects/naming"
                },
                {
                  "fieldId": "adoProject",
                  "type": "string",
                  "displayName": "ADO Project",
                  "description": "Azure DevOps project name",
                  "required": true,
                  "validation": "^[A-Za-z0-9][A-Za-z0-9-_ ]*$",
                  "minLength": 1,
                  "maxLength": 64,
                  "placeholder": "MyProject",
                  "default": "CMP",
                  "helpUrl": "https://docs.ops-box.io/ado/projects"
                }
              ]
            },
            "source": {
              "title": "Source Configuration",
              "fields": [
                {
                  "fieldId": "sourceRepository",
                  "type": "gitdefinition",
                  "displayName": "Source Repository",
                  "description": "GitDefinition name for source code repository",
                  "required": false,
                  "default": "app-01-git",
                  "gitPurpose": "source"
                }
              ]
            },
            "ci": {
              "title": "Build Configuration",
              "fields": [
                {
                  "fieldId": "adoAgentPool",
                  "type": "select",
                  "displayName": "ADO Agent Pool",
                  "description": "Leave empty for auto-detection based on ADO Project, or manually select to override",
                  "required": false,
                  "placeholder": "Auto-detected from ADO Project",
                  "options": [
                    {"value": "", "label": "Auto-detect from ADO Project"},
                    {"value": "vmss-pr-eastus2-ado-cmp", "label": "CMP Pool (vmss-pr-eastus2-ado-cmp)"},
                    {"value": "vmss-pr-eastus2-ado-digital", "label": "Digital Pool (vmss-pr-eastus2-ado-digital)"},
                    {"value": "Default", "label": "Default Pool"}
                  ],
                  "helpUrl": "https://docs.ops-box.io/ado/agent-pools"
                }
              ]
            },
            "cd": {
              "title": "Deployment Configuration",
              "fields": [
                {
                  "fieldId": "clusterDev",
                  "type": "string",
                  "displayName": "Development Cluster",
                  "description": "Kubernetes cluster for dev environment",
                  "required": true,
                  "default": "aks-np-eastus-cmp-admin",
                  "placeholder": "aks-dev-cluster",
                  "helpUrl": "https://docs.ops-box.io/clusters/configuration"
                },
                {
                  "fieldId": "clusterProd",
                  "type": "string",
                  "displayName": "Production Cluster",
                  "description": "Kubernetes cluster for prod environment",
                  "required": true,
                  "default": "aks-prd-eastus2-cmp-admin",
                  "placeholder": "aks-prod-cluster",
                  "helpUrl": "https://docs.ops-box.io/clusters/configuration"
                },
                {
                  "name": "deployContainerImage",
                  "type": "string",
                  "displayName": "Deploy Container Image",
                  "description": "Container image for deployment job",
                  "required": true,
                  "default": "devops-tools:latest",
                  "placeholder": "devops-tools:latest",
                  "helpUrl": "https://docs.ops-box.io/deployment/containers"
                },
                {
                  "fieldId": "deploymentType",
                  "type": "select",
                  "displayName": "Deployment Type",
                  "description": "Deployment mechanism for the service",
                  "required": true,
                  "options": [
                    {"value": "none", "label": "None (Build only)"},
                    {"value": "argocd", "label": "ArgoCD"},
                    {"value": "timoni", "label": "Timoni"},
                    {"value": "timoni-argocd", "label": "Timoni + ArgoCD"},
                    {"value": "helm", "label": "Helm"}
                  ],
                  "default": "timoni"
                },
                {
                  "fieldId": "timoniBundle",
                  "type": "select",
                  "displayName": "Timoni Bundle",
                  "description": "Timoni bundle template for deployment",
                  "required": false,
                  "requiredIf": [
                    {"deploymentType": "timoni"},
                    {"deploymentType": "timoni-argocd"}
                  ],
                  "showOn": [
                    {"deploymentType": "timoni"},
                    {"deploymentType": "timoni-argocd"}
                  ],
                  "source": "pipelineTemplate",
                  "annotationPath": "ops-box.io/deployment-artifacts-templates",
                  "keysPath": "bundleDefinitionKeys",
                  "default": "deployment"
                }
              ]
            },
            "triggers": {
              "title": "Pipeline Triggers",
              "description": "Configure when pipeline runs automatically",
              "fields": [
                {
                  "fieldId": "triggerMode",
                  "type": "radio",
                  "displayName": "Trigger Mode",
                  "description": "How pipeline triggers are configured",
                  "required": true,
                  "default": "auto",
                  "options": [
                    {
                      "value": "auto",
                      "label": "Auto-generate from Deployment Strategy",
                      "description": "Automatically extract branch/tag patterns from deployment conditions"
                    },
                    {
                      "value": "custom",
                      "label": "Custom Triggers",
                      "description": "Define custom branch/tag patterns"
                    },
                    {
                      "value": "none",
                      "label": "Manual Only",
                      "description": "Pipeline runs only when manually triggered"
                    }
                  ]
                },
                {
                  "fieldId": "customBranches",
                  "type": "string-array",
                  "displayName": "Branch Triggers",
                  "description": "Branch patterns that trigger the pipeline",
                  "required": false,
                  "showOn": [{"triggerMode": "custom"}],
                  "placeholder": "main, develop, feature/*",
                  "default": ["main", "develop"],
                  "help": "Examples: main, develop, feature/*, release/*"
                },
                {
                  "fieldId": "customTags",
                  "type": "string-array",
                  "displayName": "Tag Triggers",
                  "description": "Tag patterns that trigger the pipeline",
                  "required": false,
                  "showOn": [{"triggerMode": "custom"}],
                  "placeholder": "v*, release_*",
                  "help": "Examples: v*, release_*, hotfix_*"
                },
                {
                  "fieldId": "enablePrTriggers",
                  "type": "checkbox",
                  "displayName": "Enable PR Validation",
                  "description": "Run pipeline for pull requests",
                  "required": false,
                  "default": false,
                  "showOn": [
                    {"triggerMode": "auto"},
                    {"triggerMode": "custom"}
                  ]
                }
              ]
            },
            "output": {
              "title": "Output Configuration",
              "fields": [
                {
                  "fieldId": "outputRepository",
                  "type": "gitdefinition",
                  "displayName": "Output Repository",
                  "description": "GitDefinition name for pipeline output",
                  "required": true,
                  "default": "app-01-git",
                  "gitPurpose": "output",
                  "helpUrl": "https://docs.ops-box.io/gitdefinition/output"
                }
              ]
            }
          }
        },
        "placeholderMappings": {
          "global": {
            "aks_clusters_mappings": {
              "CMP": {
                "dev": "aks-np-eastus-cmp",
                "stg": "aks-np-eastus-cmp",
                "prod": "aks-prd-eastus2-cmp"
              },
              "Digital": {
                "dev": "aks-dev-westeurope-digital",
                "prod": "aks-prd-westeurope-digital"
              },
              "default": {
                "dev": "aks-np-eastus-cmp",
                "prod": "aks-prd-eastus2-cmp"
              }
            },
            "ado_agent_pool_presets": {
              "CMP": "vmss-pr-eastus2-ado-cmp",
              "Digital": "vmss-pr-eastus2-ado-cmp",
              "default": "Default"
            },
            "service_principal_mappings": {
              "CMP": {
                "dev": "Azure-ServiceConnection-CMP-Dev",
                "stg": "Azure-ServiceConnection-CMP-Stg",
                "prod": "Azure-ServiceConnection-CMP-Prod"
              },
              "Digital": {
                "dev": "Azure-ServiceConnection-Digital-Dev",
                "prod": "Azure-ServiceConnection-Digital-Prod"
              }
            },
            "keyvault_mappings": {
              "CMP": {
                "dev": {
                  "kv-cmp-dev-eastus": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f11"
                  }
                },
                "stg": {
                  "kv-cmp-dev-eastus": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f11"
                  }
                },
                "prod": {
                  "kv-cmp-prod-eastus2": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f33"
                  }
                }
              },
              "Digital": {
                "dev": {
                  "kv-digital-dev-eastus": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f44"
                  }
                },
                "prod": {
                  "kv-digital-prod-eastus2": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f55"
                  }
                }
              },
              "DeliveryEngineering": {
                "dev": {
                  "kv-de-dev-eastus": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f66"
                  }
                },
                "prod": {
                  "kv-de-prod-eastus2": {
                    "subscriptionId": "2eddc39c-2996-4c2a-ab97-f767c39ea155",
                    "tenantId": "72f988bf-86f1-41af-91ab-2d7cd011db47",
                    "managedIdentityId": "08896b7c-b7c9-43ed-852d-5812b3234f77"
                  }
                }
              }
            }
          }
        }
      }
    # Deployment Artifacts Templates (references ConfigMaps only)
    ops-box.io/deployment-artifacts-templates: |
      configMapRefs:
        - name: deployment-artifacts-common
          namespace: ops-box
          keys:
            bundleDefinitionKeys: [deployment, deployment-kv, nginx]
            argoDefinitionKeys: [timoni-rendered, helm-chart]
    # Deployment strategy references for conditional deploy stages
    ops-box.io/deployment-strategy-templates: |
      configMapRefs:
        - name: deployment-strategy-templates
          namespace: ops-box
          keys:
            strategyKeys: [single-env, classic2, classic3]
    ops-box.io/placeholders: |
      [
        {
          "name": "OB_PIPELINE_NAME",
          "scope": "global",
          "resolveFrom": "self.spec.projectName",
          "crField": "metadata.name"
        },
        {
          "name": "SOURCE_GIT_DEFINITION",
          "scope": "global",
          "wizardRef": "sourceRepository",
          "comment": "Computed from sourceRepository field, seeded by BFF",
          "crField": "spec.sourceRepository.gitDefinitionName"
        },
        {
          "name": "TEMPLATES_GIT_DEFINITION",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "demo-app-01-git",
          "crField": "spec.templatesSource.gitDefinitionName"
        },
        {
          "name": "OUTPUT_GIT_DEFINITION",
          "scope": "global",
          "wizardRef": "outputRepository",
          "default": "{{PROJECT_NAME}}-git",
          "comment": "From wizard outputRepository field, defaults to {projectName}-git if not provided",
          "crField": "spec.outputs.pipeline.gitDefinitionName"
        },
        {
          "name": "ADO_AGENT_POOL",
          "scope": "lookup",
          "lookupTable": "ado_agent_pool_presets",
          "lookupPath": "{{ADO_PROJECT}}",
          "default": "Default",
          "wizardRef": "adoAgentPool",
          "comment": "Derived from ADO project using lookup table, can be overridden via wizard",
          "crField": "spec.adoAgentPool"
        },
        {
          "name": "ACR_VARIABLE_GROUP",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "ACR Catalina"
        },
        {
          "name": "SERVICE_NAME",
          "scope": "global",
          "resolveFrom": "gitdefinition.ops-box.io/v1.spec.purposes.source.services[0].name"
        },
        {
          "name": "OB_SERVICES",
          "scope": "global",
          "resolveFrom": "gitdefinition.ops-box.io/v1.{{SOURCE_GIT_DEFINITION}}.spec.purposes.source.services"
        },
        {
          "name": "OB_SERVICE_NAME",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "name"
        },
        {
          "name": "OB_SERVICE_CONTEXT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "serviceSrcPath"
        },
        {
          "name": "OB_SERVICE_DOCKERFILE",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "dockerfilePath",
          "default": "Dockerfile"
        },
        {
          "name": "OB_SERVICE_BUILD_COMMAND",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "buildCommand",
          "default": "",
          "languageDefaults": {
            "python": "",
            "nodejs": "npm install && npm run build --if-present && npm prune --production",
            "java": "mvn clean package -DskipTests -T 1C -Duser.timezone=UTC"
          }
        },
        {
          "name": "OB_SERVICE_TEST_COMMAND",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "testCommand",
          "default": ""
        },
        {
          "name": "OB_SERVICE_PORT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "port",
          "default": "8080"
        },
        {
          "name": "OB_CONTAINER_PORT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "port",
          "default": "8080",
          "comment": "Container port (alias for OB_SERVICE_PORT for Timoni bundles)"
        },
        {
          "name": "OB_HEALTH_PATH",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "healthCheck.path",
          "default": "/health"
        },
        {
          "name": "OB_CPU_REQUEST",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.requests.cpu",
          "default": "100m"
        },
        {
          "name": "OB_MEMORY_REQUEST",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.requests.memory",
          "default": "128Mi"
        },
        {
          "name": "OB_CPU_LIMIT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.limits.cpu",
          "default": "500m"
        },
        {
          "name": "OB_MEMORY_LIMIT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.limits.memory",
          "default": "512Mi"
        },
        {
          "name": "PROJECT_NAME",
          "scope": "global",
          "wizardRef": "projectName",
          "comment": "Seeded by BFF from wizard"
        },
        {
          "name": "CONTAINER_REGISTRY",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "Catalina ACR"
        },
        {
          "name": "CONTAINER_REGISTRY_FULL_NAME",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "catalina.azurecr.io"
        },
        {
          "name": "ADO_PROJECT",
          "scope": "global",
          "wizardRef": "adoProject",
          "comment": "Seeded by BFF from wizard",
          "crField": "spec.adoProject"
        },
        {
          "name": "CLUSTER_DEV",
          "scope": "lookup",
          "lookupTable": "aks_clusters_mappings",
          "resolveLookupPath": [
            {"resolveFrom": "{{ADO_PROJECT}}"},
            {"static": "dev"}
          ]
        },
        {
          "name": "CLUSTER_PROD",
          "scope": "lookup",
          "lookupTable": "aks_clusters_mappings",
          "resolveLookupPath": [
            {"resolveFrom": "{{ADO_PROJECT}}"},
            {"static": "prod"}
          ]
        },
        {
          "name": "DEPLOY_CONTAINER_IMAGE",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "devops-tools:latest",
          "comment": "Container image for deployment jobs"
        },
        {
          "name": "KV_ENVIRONMENTS",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "keyVaults",
          "transformType": "kv_environments_to_metadata",
          "comment": "Extracts KeyVault metadata per environment with complete Azure details (uses first KeyVault if multiple)"
        },
        {
          "name": "KV_OBJECTS",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "keyVaults",
          "transformType": "kv_secrets_to_objects",
          "comment": "Extracts secrets from KeyVault and transforms to CUE objects array"
        },
        {
          "name": "KV_SECRET_MAPPINGS",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "keyVaults",
          "transformType": "kv_secrets_to_mappings",
          "comment": "Extracts secrets from KeyVault and transforms to CUE secret mappings"
        },
        {
          "name": "KV_ENV_FROM_SECRETS",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "keyVaults",
          "transformType": "kv_env_from_secrets",
          "comment": "Transforms secrets to envFromSecrets CUE structure for mounting as environment variables"
        }
      ]
spec:
  draft: true
  sourceRepository:
    gitDefinitionName: "{{SOURCE_GIT_DEFINITION}}"
  templatesSource:
    gitDefinitionName: "{{TEMPLATES_GIT_DEFINITION}}"
    basePath: templates/
  outputs:
    pipeline:
      gitDefinitionName: "{{OUTPUT_GIT_DEFINITION}}"
      path: .ci/azure-pipelines.yml
  placeholderMappings:
    # Populated by AdoApplicationMapper
    # Format: {"{{PLACEHOLDER_NAME}}": "resolved-value"}
    # For per-item placeholders: {"job-id.{{OB_SERVICE_NAME}}": "service-name"}
    global: {}
    perItem: {}
  pipelineDefinition:
    name: $(Build.SourceBranchName).$(Build.BuildId)
    pool: "{{ADO_AGENT_POOL}}"
    # trigger: REMOVED - dynamically generated by PipelineConstructor from spec.triggers
    # PipelineConstructor reads spec.triggers and generates appropriate trigger section based on:
    # - triggerMode: "auto" (extract from deployment strategy), "custom" (use customBranches/Tags), "none" (manual only)
    # - customBranches: ["main", "develop"] (when triggerMode=custom)
    # - customTags: ["v*", "release-*"] (when triggerMode=custom)
    # - enablePrTriggers: true/false
    parameters:
      - name: services
        type: object
        default: []
    variables:
      - group: devops-credentials
      - group: "{{ACR_VARIABLE_GROUP}}"
      - name: projectName
        value: "{{PROJECT_NAME}}"
      - name: containerRegistry
        value: "{{CONTAINER_REGISTRY}}"
      - name: containerRegistryFullName
        value: "{{CONTAINER_REGISTRY_FULL_NAME}}"
    stages:
      - stage: Build
        displayName: CI
        jobs:
          - baseTemplate: templates/jobs/kaniko-python-build.yml
            job: template
            jobId: Build_{{SERVICE_NAME}}_service
      - stage: Deploy
        displayName: CD
        dependsOn: Build
        condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/release-'))
        variables:
          buildTag: $[ stageDependencies.Build.Build_{{SERVICE_NAME}}_service.outputs['buildVars.buildTag'] ]
        jobs:
          - job: deploy
            displayName: Deploy to Kubernetes
            variables:
              - name: serviceName
                value: "{{SERVICE_NAME}}"
              - name: projectName
                value: "{{PROJECT_NAME}}"
            container:
              image: "{{DEPLOY_CONTAINER_IMAGE}}"
              endpoint: "{{CONTAINER_REGISTRY}}"
              options: --user root
            steps:
              - checkout: self
              - task: Bash@3
                displayName: Determine Environment and Context
                inputs:
                  targetType: inline
                  script: |-
                    export KUBECONFIG=/workspace/.kube/config
                    if [[ "$(Build.SourceBranch)" == "refs/heads/main" ]]; then
                      ENVIRONMENT="dev"
                      NAMESPACE_SUFFIX="dev"
                    elif [[ "$(Build.SourceBranch)" =~ ^refs/tags/release-.* ]]; then
                      ENVIRONMENT="prd"
                      NAMESPACE_SUFFIX="prd"
                    else
                      echo "Unknown branch/tag pattern"
                      exit 1
                    fi
                    ADO_PROJECT="$(System.TeamProject)"
                    if [[ "$ADO_PROJECT" == "{{ADO_PROJECT}}" ]]; then
                      if [[ "$ENVIRONMENT" == "dev" ]]; then
                        K8S_CONTEXT="{{CLUSTER_DEV}}"
                      else
                        K8S_CONTEXT="{{CLUSTER_PROD}}"
                      fi
                    fi
                    echo "##vso[task.setvariable variable=ENVIRONMENT]$ENVIRONMENT"
                    echo "##vso[task.setvariable variable=K8S_CONTEXT]$K8S_CONTEXT"
              - task: Bash@3
                displayName: Deploy with Timoni
                inputs:
                  targetType: inline
                  script: |-
                    export KUBECONFIG=/workspace/.kube/config
                    cd $(Build.SourcesDirectory)/.ci
                    kubectl config use-context $(K8S_CONTEXT)
                    timoni registry login $(containerRegistryFullName) --username $(global.acrUsername) --password $(global.acrPasswd)
                    cat > runtime.yaml << EOF
                    runtime:
                      name: "$(ENVIRONMENT)"
                    global:
                      image:
                        tag: "$(buildTag)"
                    EOF
                    timoni bundle apply -f timoni-$(serviceName)-bundle.cue -f runtime.yaml --kube-context $(K8S_CONTEXT)
              - task: Bash@3
                displayName: Verify Deployment
                inputs:
                  targetType: inline
                  script: |-
                    export KUBECONFIG=/workspace/.kube/config
                    kubectl wait --for=condition=available --timeout=300s deployment/$(projectName)-$(serviceName) -n $(projectName)-$(ENVIRONMENT)
                    kubectl get pods -n $(projectName)-$(ENVIRONMENT) -l app=$(projectName)-$(serviceName)
