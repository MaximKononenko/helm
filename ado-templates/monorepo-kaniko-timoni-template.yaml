apiVersion: ops-box.io/v1
kind: AdoPipelineDefinition
metadata:
  name: ado-pipeline-monorepo-kaniko-timoni
  namespace: ops-box
  labels:
    ops-box.io/template: "true"
    ops-box.io/language: "multi"
    ops-box.io/build-tool: "kaniko"
    ops-box.io/deploy-tool: "timoni"
    ops-box.io/repo-type: "monorepo"
  annotations:
    ops-box.io/display-name: "Monorepo CI/CD (Kaniko + Timoni)"
    ops-box.io/description: "CI/CD pipeline for monorepo with multiple services, Kaniko builds and Timoni deployments"
    ops-box.io/job-templates: |
      {
        "Build": {
          "python": "templates/jobs/kaniko-python-build.yml",
          "java": "templates/jobs/kaniko-java-maven-build.yml",
          "nodejs": "templates/jobs/kaniko-nodejs-build.yml",
          "kotlin": "templates/jobs/kaniko-kotlin-gradle-build.yml"
        },
        "Deploy": {
          "python": "templates/jobs/timoni-deploy.yml",
          "java": "templates/jobs/timoni-deploy.yml",
          "nodejs": "templates/jobs/timoni-deploy.yml",
          "kotlin": "templates/jobs/timoni-deploy.yml"
        }
      }
    # IMPORTANT: Awoid setting default value for "fieldId": "adoAgentPool" here to allow 
    # wizard override. It affects auto-detection logic for application self-service wizard.
    # With emptu value it will auto-detect based on ADO project using lookup table. But you
    # can still override it manually.
    ops-box.io/template-config: |
      {
        "wizard_config": {
          "steps": {
            "project": {
              "title": "Project Setup",
              "fields": [
                {
                  "fieldId": "projectName",
                  "type": "string",
                  "displayName": "Project Name",
                  "description": "Project name for resource grouping",
                  "required": true,
                  "validation": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
                  "minLength": 3,
                  "maxLength": 63,
                  "placeholder": "my-project",
                  "default": "app-01",
                  "helpUrl": "https://docs.ops-box.io/projects/naming"
                },
                {
                  "fieldId": "adoProject",
                  "type": "string",
                  "displayName": "ADO Project",
                  "description": "Azure DevOps project name",
                  "required": true,
                  "validation": "^[A-Za-z0-9][A-Za-z0-9-_ ]*$",
                  "minLength": 1,
                  "maxLength": 64,
                  "placeholder": "MyProject",
                  "default": "CMP",
                  "helpUrl": "https://docs.ops-box.io/ado/projects"
                }
              ]
            },
            "source": {
              "title": "Source Configuration",
              "fields": [
                {
                  "fieldId": "sourceRepository",
                  "type": "gitdefinition",
                  "displayName": "Source Repository",
                  "description": "GitDefinition name for source code repository",
                  "required": false,
                  "default": "app-01-git",
                  "gitPurpose": "source"
                }
              ]
            },
            "ci": {
              "title": "Build Configuration",
              "fields": [
                {
                  "fieldId": "adoAgentPool",
                  "type": "select",
                  "displayName": "ADO Agent Pool",
                  "description": "Leave empty for auto-detection based on ADO Project, or manually select to override",
                  "required": false,
                  "placeholder": "Auto-detected from ADO Project",
                  "options": [
                    {"value": "", "label": "Auto-detect from ADO Project"},
                    {"value": "vmss-pr-eastus2-ado-cmp", "label": "CMP Pool (vmss-pr-eastus2-ado-cmp)"},
                    {"value": "vmss-pr-eastus2-ado-digital", "label": "Digital Pool (vmss-pr-eastus2-ado-digital)"},
                    {"value": "Default", "label": "Default Pool"}
                  ],
                  "helpUrl": "https://docs.ops-box.io/ado/agent-pools"
                }
              ]
            },
            "cd": {
              "title": "Deployment Configuration",
              "fields": [
                {
                  "fieldId": "clusterDev",
                  "type": "string",
                  "displayName": "Development Cluster",
                  "description": "Kubernetes cluster for dev environment",
                  "required": true,
                  "default": "aks-np-eastus-cmp-admin",
                  "placeholder": "aks-dev-cluster",
                  "helpUrl": "https://docs.ops-box.io/clusters/configuration"
                },
                {
                  "fieldId": "clusterProd",
                  "type": "string",
                  "displayName": "Production Cluster",
                  "description": "Kubernetes cluster for prod environment",
                  "required": true,
                  "default": "aks-prd-eastus2-cmp-admin",
                  "placeholder": "aks-prod-cluster",
                  "helpUrl": "https://docs.ops-box.io/clusters/configuration"
                }
              ]
            },
            "output": {
              "title": "Output Configuration",
              "fields": [
                {
                  "fieldId": "outputRepository",
                  "type": "gitdefinition",
                  "displayName": "Output Repository",
                  "description": "GitDefinition name for pipeline output",
                  "required": true,
                  "default": "app-01-git",
                  "gitPurpose": "output",
                  "helpUrl": "https://docs.ops-box.io/gitdefinition/output"
                }
              ]
            }
          },
          "deployment_strategy_presets": {
            "CMP": {
              "dev": "aks-np-eastus-cmp-admin",
              "prod": "aks-prd-eastus2-cmp-admin"
            },
            "Digital": {
              "dev": "aks-dev-westeurope-digital",
              "prod": "aks-prd-westeurope-digital"
            },
            "default": {
              "dev": "aks-np-eastus-cmp-admin",
              "prod": "aks-prd-eastus2-cmp-admin"
            }
          },
          "ado_agent_pool_presets": {
            "CMP": "vmss-pr-eastus2-ado-cmp",
            "Digital": "vmss-pr-eastus2-ado-cmp",
            "default": "Default"
          }
        }
      }
    # Deployment Artifacts Templates (V2 refactoring - structured annotation)
    # Single source of truth for all deployment artifact templates
    # Structure mirrors deploymentArtifacts spec for consistency
    # BFF discovers available templates from this annotation automatically
    ops-box.io/deployment-artifacts-templates: |
      timoniBundles:
        deployment:
          label: "Standard Deployment"
          description: "Stateless applications (APIs, web services)"
          timoniModule: "oci://catalina.azurecr.io/classic-deployment:0.2.3"
          template: |
            // Timoni Bundle for {{PROJECT_NAME}}
            // Generated by ops-box self-service wizard

            runtime: {
              name: string
            }

            global: {
              image: {
                tag: *"latest" | string
              }
            }

            bundle: {
              apiVersion: "v1alpha1"
              name:       "{{PROJECT_NAME}}-{{OB_SERVICE_NAME}}"
              instances: {
                "{{PROJECT_NAME}}-{{OB_SERVICE_NAME}}": {
                  module: {
                    url:     "oci://catalina.azurecr.io/classic-deployment"
                    version: "0.2.3"
                  }
                  namespace: "{{PROJECT_NAME}}-\(runtime.name)"
                  values: {
                    image: {
                      repository: "{{CONTAINER_REGISTRY}}.azurecr.io/{{PROJECT_NAME}}/{{OB_SERVICE_NAME}}"
                      tag:        global.image.tag
                      digest:     ""
                      pullPolicy: "IfNotPresent"
                    }
              
                    // Environment-specific replicas
                    replicas: *1 | int
                    if runtime.name == "prd" {
                      replicas: 2
                    }
              
                    service: port: {{OB_SERVICE_PORT}}
                    containerPort: {{OB_SERVICE_PORT}}
                    probes: {
                      liveness: {
                        path: "{{OB_HEALTH_PATH}}"
                        initialDelaySeconds: 10
                        periodSeconds: 30
                      }
                      readiness: {
                        path: "{{OB_HEALTH_PATH}}"
                        initialDelaySeconds: 10
                        periodSeconds: 30
                      }
                    }
                    env: {
                      LOG_LEVEL: "INFO"
                    }
              
                    // Environment-specific resources
                    resources: {
                      if runtime.name == "prd" {
                        requests: {
                          cpu:    "{{OB_CPU_REQUEST}}"
                          memory: "{{OB_MEMORY_REQUEST}}"
                        }
                        limits: {
                          cpu:    "{{OB_CPU_LIMIT}}"
                          memory: "{{OB_MEMORY_LIMIT}}"
                        }
                      }
                      if runtime.name != "prd" {
                        requests: {
                          cpu:    "{{OB_CPU_REQUEST}}"
                          memory: "{{OB_MEMORY_REQUEST}}"
                        }
                        limits: {
                          cpu:    "{{OB_CPU_LIMIT}}"
                          memory: "{{OB_MEMORY_LIMIT}}"
                        }
                      }
                    }
              
                    // Environment-specific ingress
                    ingress: {
                      enabled: false
                      annotations: {
                        "kubernetes.io/ingress.class": "nginx"
                      }
                      hosts: [
                        {
                          if runtime.name == "prd" {
                            host: "{{OB_SERVICE_NAME}}.catmktg.com"
                          }
                          if runtime.name != "prd" {
                            host: "{{OB_SERVICE_NAME}}-\(runtime.name).catmktg.com"
                          }
                          paths: [
                            {
                              path:     "/"
                              pathType: "Prefix"
                            },
                          ]
                        },
                      ]
                    }
                  }
                }
              }
            }
    ops-box.io/placeholders: |
      [
        {
          "name": "SOURCE_GIT_DEFINITION",
          "scope": "global",
          "wizardRef": "sourceRepository",
          "comment": "Computed from sourceRepository field, seeded by BFF",
          "crField": "spec.sourceRepository.gitDefinitionName"
        },
        {
          "name": "TEMPLATES_GIT_DEFINITION",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "demo-app-01-git",
          "crField": "spec.templatesSource.gitDefinitionName"
        },
        {
          "name": "OUTPUT_GIT_DEFINITION",
          "scope": "global",
          "wizardRef": "outputRepository",
          "default": "{{PROJECT_NAME}}-git",
          "comment": "From wizard outputRepository field, defaults to {projectName}-git if not provided",
          "crField": "spec.outputs.pipeline.gitDefinitionName"
        },
        {
          "name": "ADO_AGENT_POOL",
          "scope": "lookup",
          "lookupTable": "ado_agent_pool_presets",
          "lookupKey": "{{ADO_PROJECT}}",
          "default": "Default",
          "wizardRef": "adoAgentPool",
          "comment": "Derived from ADO project using lookup table, can be overridden via wizard",
          "crField": "spec.adoAgentPool"
        },
        {
          "name": "ACR_VARIABLE_GROUP",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "ACR Catalina"
        },
        {
          "name": "NODE_VERSION",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "18"
        },
        {
          "name": "PYTHON_VERSION",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "3.12"
        },
        {
          "name": "OB_SERVICES",
          "scope": "global",
          "resolveFrom": "gitdefinition.ops-box.io/v1.{{SOURCE_GIT_DEFINITION}}.spec.purposes.source.services"
        },
        {
          "name": "OB_SERVICE_NAME",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "name"
        },
        {
          "name": "OB_SERVICE_CONTEXT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "serviceSrcPath"
        },
        {
          "name": "OB_SERVICE_DOCKERFILE",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "dockerfilePath",
          "default": "Dockerfile"
        },
        {
          "name": "OB_SERVICE_LANGUAGE",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "language"
        },
        {
          "name": "OB_SERVICE_BUILD_COMMAND",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "buildCommand",
          "default": "",
          "languageDefaults": {
            "python": "",
            "nodejs": "npm install && npm run build --if-present && npm prune --production",
            "java": "mvn clean package -DskipTests -T 1C -Duser.timezone=UTC",
            "kotlin": "./gradlew clean build -x test --no-daemon"
          }
        },
        {
          "name": "OB_SERVICE_TEST_COMMAND",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "testCommand",
          "default": ""
        },
        {
          "name": "OB_SERVICE_ARTIFACTS_PATH",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "artifactsPath",
          "default": "",
          "comment": "Artifacts output path for Option 2 CI pattern (Java/Maven). Used as Docker context after build."
        },
        {
          "name": "OB_SERVICE_PORT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "port",
          "default": "8080"
        },
        {
          "name": "OB_HEALTH_PATH",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "healthCheck.path",
          "default": "/health"
        },
        {
          "name": "OB_CPU_REQUEST",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.requests.cpu",
          "default": "100m"
        },
        {
          "name": "OB_MEMORY_REQUEST",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.requests.memory",
          "default": "128Mi"
        },
        {
          "name": "OB_CPU_LIMIT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.limits.cpu",
          "default": "500m"
        },
        {
          "name": "OB_MEMORY_LIMIT",
          "scope": "per-item",
          "resolveFrom": "self.placeholders.OB_SERVICES",
          "iterateOver": "resources.limits.memory",
          "default": "512Mi"
        },
        {
          "name": "PROJECT_NAME",
          "scope": "global",
          "wizardRef": "projectName",
          "comment": "Seeded by BFF from wizard"
        },
        {
          "name": "CONTAINER_REGISTRY",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "Catalina ACR"
        },
        {
          "name": "CONTAINER_REGISTRY_FULL_NAME",
          "scope": "global",
          "resolveFrom": "constant",
          "default": "catalina.azurecr.io"
        },
        {
          "name": "ADO_PROJECT",
          "scope": "global",
          "wizardRef": "adoProject",
          "comment": "Seeded by BFF from wizard",
          "crField": "spec.adoProject"
        },
        {
          "name": "CLUSTER_DEV",
          "scope": "lookup",
          "lookupTable": "deployment_strategy_presets",
          "lookupKey": "{{ADO_PROJECT}}",
          "lookupField": "dev"
        },
        {
          "name": "CLUSTER_PROD",
          "scope": "lookup",
          "lookupTable": "deployment_strategy_presets",
          "lookupKey": "{{ADO_PROJECT}}",
          "lookupField": "prod"
        }
      ]
spec:
  draft: true
  sourceRepository:
    gitDefinitionName: "{{SOURCE_GIT_DEFINITION}}"
  templatesSource:
    gitDefinitionName: "{{TEMPLATES_GIT_DEFINITION}}"
    basePath: templates/
  outputs:
    pipeline:
      gitDefinitionName: "{{OUTPUT_GIT_DEFINITION}}"
      path: .ci/azure-pipelines.yml
  placeholderMappings:
    # Populated by AdoApplicationMapper
    # Format: {"{{PLACEHOLDER_NAME}}": "resolved-value"}
    # For per-item placeholders: {"job-id.{{OB_SERVICE_NAME}}": "service-name"}
    global: {}
    perItem: {}
  pipelineDefinition:
    name: $(Build.SourceBranchName).$(Build.BuildId)
    pool: "{{ADO_AGENT_POOL}}"
    trigger:
      batch: true
      branches:
        include:
          - main
          - develop
    parameters:
      - name: services
        type: object
        default: []
    variables:
      - group: devops-credentials
      - group: "{{ACR_VARIABLE_GROUP}}"
      - name: projectName
        value: "{{PROJECT_NAME}}"
      - name: containerRegistry
        value: "{{CONTAINER_REGISTRY}}"
      - name: containerRegistryFullName
        value: "{{CONTAINER_REGISTRY_FULL_NAME}}"
    stages:
      - stage: Build
        displayName: CI
        jobs:
        # PipelineConstructor will inject baseTemplate entries here, one per service
        # Example output after PipelineConstructor:
        # - baseTemplate: templates/jobs/kaniko-python-build.yml
        #   job: template
        #   jobId: Build_api_service
        # - baseTemplate: templates/jobs/kaniko-java-build.yml  
        #   job: template
        #   jobId: Build_worker_service
        # Placeholder for dynamic baseTemplate injection
      - stage: Deploy
        displayName: CD
        dependsOn: Build
        condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/release-'))
        jobs:

# PipelineConstructor will inject baseTemplate entries here, one per service
# Example output after PipelineConstructor:
# - baseTemplate: templates/jobs/timoni-deploy.yml
#   job: template
#   jobId: Deploy_api_service
# - baseTemplate: templates/jobs/timoni-deploy.yml  
#   job: template
#   jobId: Deploy_worker_service
# Placeholder for dynamic baseTemplate injection
