apiVersion: ops-box.io/v1
kind: AdoPipelineDefinition
metadata:
  name: ado-pipeline-monorepo-kaniko-timoni
  namespace: ops-box
  labels:
    ops-box.io/template: "true"
    ops-box.io/language: "multi"
    ops-box.io/build-tool: "kaniko"
    ops-box.io/deploy-tool: "timoni"
    ops-box.io/repo-type: "monorepo"
  annotations:
    ops-box.io/display-name: "Monorepo CI/CD (Kaniko + Timoni)"
    ops-box.io/description: "CI/CD pipeline for monorepo with multiple services, Kaniko builds and Timoni deployments"
    ops-box.io/job-templates: |
      {
        "Build": {
          "python": "templates/jobs/kaniko-python-build.yml",
          "java": "templates/jobs/kaniko-java-maven-build.yml",
          "nodejs": "templates/jobs/kaniko-nodejs-build.yml",
          "kotlin": "templates/jobs/kaniko-kotlin-gradle-build.yml"
        },
        "Deploy": {
          "python": "templates/jobs/timoni-deploy.yml",
          "java": "templates/jobs/timoni-deploy.yml",
          "nodejs": "templates/jobs/timoni-deploy.yml",
          "kotlin": "templates/jobs/timoni-deploy.yml"
        }
      }
    ops-box.io/wizard-config: |
      {
        "steps": [
          {"id": "project", "label": "Project Setup"},
          {"id": "source", "label": "Source Configuration"},
          {"id": "ci", "label": "Build Configuration"},
          {"id": "cd", "label": "Deployment Configuration"},
          {"id": "output", "label": "Output Configuration"}
        ]
      }
    ops-box.io/placeholders: |
      [
        {
          "name": "OB_PIPELINE_NAME",
          "wizardStep": "project",
          "displayName": "Pipeline Name",
          "description": "Unique name for the pipeline (auto-filled from project name)",
          "required": true,
          "scope": "global",
          "type": "string",
          "crField": "metadata.name",
          "autoResolve": true,
          "resolveFrom": "application.spec.projectName",
          "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
          "minLength": 3,
          "maxLength": 63,
          "placeholder": "my-app-pipeline",
          "helpUrl": "https://docs.ops-box.io/pipelines/naming"
        },
        {
          "name": "SOURCE_GIT_DEFINITION",
          "wizardStep": "source",
          "displayName": "Source Repository",
          "description": "GitDefinition name for source code repository",
          "required": true,
          "scope": "global",
          "type": "gitdefinition",
          "gitPurpose": "source",
          "crField": "spec.sourceRepository.gitDefinitionName",
          "default": "app-01-git",
          "hidden": true
        },
        {
          "name": "TEMPLATES_GIT_DEFINITION",
          "wizardStep": "ci",
          "displayName": "Templates Repository",
          "description": "GitDefinition name for pipeline templates",
          "required": true,
          "scope": "global",
          "type": "gitdefinition",
          "gitPurpose": "templates",
          "default": "demo-app-01-git",
          "hidden": true
        },
        {
          "name": "OUTPUT_GIT_DEFINITION",
          "wizardStep": "output",
          "displayName": "Output Repository",
          "description": "GitDefinition name for pipeline output",
          "required": true,
          "scope": "global",
          "type": "gitdefinition",
          "gitPurpose": "output",
          "crField": "spec.outputs.pipeline.gitDefinitionName",
          "default": "app-01-git",
          "helpUrl": "https://docs.ops-box.io/gitdefinition/output"
        },
        {
          "name": "ADO_AGENT_POOL",
          "wizardStep": "ci",
          "displayName": "ADO Agent Pool",
          "description": "Azure DevOps agent pool name",
          "required": true,
          "scope": "global",
          "type": "string",
          "default": "Default",
          "placeholder": "Default",
          "helpUrl": "https://docs.ops-box.io/ado/agent-pools"
        },
        {
          "name": "ACR_VARIABLE_GROUP",
          "wizardStep": "ci",
          "displayName": "ACR Variable Group",
          "description": "Azure DevOps variable group for container registry credentials",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "system.acrVariableGroup",
          "default": "ACR Catalina",
          "placeholder": "acr-credentials",
          "helpUrl": "https://docs.ops-box.io/ado/variable-groups"
        },
        {
          "name": "OB_SERVICES",
          "wizardStep": "ci",
          "displayName": "Services Configuration",
          "description": "Array of service objects from GitDefinition (monorepo with multiple services)",
          "required": true,
          "scope": "global",
          "type": "object",
          "autoResolve": true,
          "resolveFrom": "gitdefinition.spec.services",
          "hidden": true,
          "helpUrl": "https://docs.ops-box.io/gitdefinition/services"
        },
        {
          "name": "OB_SERVICE_NAME",
          "displayName": "Service Name (Per-Item)",
          "description": "Service name resolved per service in monorepo",
          "required": true,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.name",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "hidden": true
        },
        {
          "name": "OB_SERVICE_CONTEXT",
          "displayName": "Service Context (Per-Item)",
          "description": "Service source path resolved per service in monorepo",
          "required": true,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.serviceSrcPath",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "hidden": true
        },
        {
          "name": "OB_SERVICE_DOCKERFILE",
          "displayName": "Service Dockerfile (Per-Item)",
          "description": "Dockerfile path resolved per service in monorepo",
          "required": false,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.dockerfilePath",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "default": "Dockerfile",
          "hidden": true
        },
        {
          "name": "OB_SERVICE_LANGUAGE",
          "displayName": "Service Language (Per-Item)",
          "description": "Programming language resolved per service in monorepo",
          "required": true,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.language",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "hidden": true
        },
        {
          "name": "OB_SERVICE_BUILD_COMMAND",
          "displayName": "Service Build Command (Per-Item)",
          "description": "Custom build command per service (language-specific defaults applied if not specified)",
          "required": false,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.buildCommand",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "default": "",
          "languageDefaults": {
            "python": "",
            "nodejs": "npm ci && npm run build --if-present && npm prune --production",
            "java": "mvn clean package -DskipTests -T 1C -Duser.timezone=UTC"
          },
          "hidden": true
        },
        {
          "name": "OB_SERVICE_TEST_COMMAND",
          "displayName": "Service Test Command (Per-Item)",
          "description": "Custom test command per service (optional - uses language defaults if not specified)",
          "required": false,
          "scope": "per-item",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "item.testCommand",
          "iterateOver": "gitdefinition.spec.purposes.source.services",
          "default": "",
          "hidden": true
        },
        {
          "name": "PROJECT_NAME",
          "wizardStep": "project",
          "displayName": "Project Name",
          "description": "Project name for resource grouping",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "application.spec.projectName",
          "default": "app-01",
          "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
          "minLength": 3,
          "maxLength": 63,
          "placeholder": "my-project",
          "helpUrl": "https://docs.ops-box.io/projects/naming"
        },
        {
          "name": "CONTAINER_REGISTRY",
          "wizardStep": "ci",
          "displayName": "Container Registry",
          "description": "Container registry hostname (without .azurecr.io)",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "system.containerRegistry",
          "default": "Catalina ACR",
          "pattern": "^[a-z0-9]+$",
          "placeholder": "myregistry",
          "helpUrl": "https://docs.ops-box.io/registry/configuration"
        },
        {
          "name": "CONTAINER_REGISTRY_FULL_NAME",
          "wizardStep": "ci",
          "displayName": "Container Registry Full Name",
          "description": "Full container registry URL",
          "required": true,
          "scope": "global",
          "type": "string",
          "format": "url",
          "autoResolve": true,
          "resolveFrom": "system.containerRegistryFullName",
          "default": "catalina.azurecr.io",
          "pattern": "^[a-z0-9]+\\.azurecr\\.io$",
          "placeholder": "myregistry.azurecr.io",
          "hidden": true
        },
        {
          "name": "ADO_PROJECT",
          "wizardStep": "project",
          "displayName": "ADO Project",
          "description": "Azure DevOps project name",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "application.spec.adoProject",
          "default": "CMP",
          "pattern": "^[A-Za-z0-9][A-Za-z0-9-_ ]*$",
          "minLength": 1,
          "maxLength": 64,
          "placeholder": "MyProject",
          "helpUrl": "https://docs.ops-box.io/ado/projects"
        },
        {
          "name": "CLUSTER_DEV",
          "wizardStep": "cd",
          "displayName": "Development Cluster",
          "description": "Kubernetes cluster for dev environment",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "remotecluster.labels[ops-box.io/environment=dev]",
          "default": "aks-np-eastus-cmp-admin",
          "placeholder": "aks-dev-cluster",
          "helpUrl": "https://docs.ops-box.io/clusters/configuration"
        },
        {
          "name": "CLUSTER_PROD",
          "wizardStep": "cd",
          "displayName": "Production Cluster",
          "description": "Kubernetes cluster for prod environment",
          "required": true,
          "scope": "global",
          "type": "string",
          "autoResolve": true,
          "resolveFrom": "remotecluster.labels[ops-box.io/environment=prod]",
          "default": "aks-prd-eastus2-cmp-admin",
          "placeholder": "aks-prod-cluster",
          "helpUrl": "https://docs.ops-box.io/clusters/configuration"
        }
      ]
spec:
  draft: true
  sourceRepository:
    gitDefinitionName: "{{SOURCE_GIT_DEFINITION}}"
  templatesSource:
    gitDefinitionName: "{{TEMPLATES_GIT_DEFINITION}}"
    basePath: templates/
  outputs:
    pipeline:
      gitDefinitionName: "{{OUTPUT_GIT_DEFINITION}}"
      path: .ci/azure-pipelines.yml
  placeholderMappings:
    # Populated by AdoApplicationMapper
    # Format: {"{{PLACEHOLDER_NAME}}": "resolved-value"}
    # For per-item placeholders: {"job-id.{{OB_SERVICE_NAME}}": "service-name"}
    global: {}
    perItem: {}
  pipelineDefinition:
    name: $(Build.SourceBranchName).$(Build.BuildId)
    pool: "{{ADO_AGENT_POOL}}"
    trigger:
      batch: true
      branches:
        include:
          - main
          - develop
    parameters:
      - name: services
        type: object
        default: []
    variables:
      - group: devops-credentials
      - group: "{{ACR_VARIABLE_GROUP}}"
      - name: projectName
        value: "{{PROJECT_NAME}}"
      - name: containerRegistry
        value: "{{CONTAINER_REGISTRY}}"
      - name: containerRegistryFullName
        value: "{{CONTAINER_REGISTRY_FULL_NAME}}"
    stages:
      - stage: Build
        displayName: CI
        jobs:
        # PipelineConstructor will inject baseTemplate entries here, one per service
        # Example output after PipelineConstructor:
        # - baseTemplate: templates/jobs/kaniko-python-build.yml
        #   job: template
        #   jobId: Build_api_service
        # - baseTemplate: templates/jobs/kaniko-java-build.yml  
        #   job: template
        #   jobId: Build_worker_service
        # Placeholder for dynamic baseTemplate injection
      - stage: Deploy
        displayName: CD
        dependsOn: Build
        jobs:
        # PipelineConstructor will inject baseTemplate entries here, one per service
        # Example output after PipelineConstructor:
        # - baseTemplate: templates/jobs/timoni-deploy.yml
        #   job: template
        #   jobId: Deploy_api_service
        # - baseTemplate: templates/jobs/timoni-deploy.yml  
        #   job: template
        #   jobId: Deploy_worker_service
        # Placeholder for dynamic baseTemplate injection
