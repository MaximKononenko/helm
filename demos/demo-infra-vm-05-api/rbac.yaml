apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api-user
  namespace: azureserviceoperator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api-role
rules:
  # Allow managing KubeVela Applications
  - apiGroups: ["core.oam.dev"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow reading Application status and related resources
  - apiGroups: ["core.oam.dev"]
    resources: ["applications/status"]
    verbs: ["get", "list", "watch"]
  # Allow reading ComponentDefinitions (to understand available types)
  - apiGroups: ["core.oam.dev"]
    resources: ["componentdefinitions"]
    verbs: ["get", "list", "watch"]
  # Allow reading ASO2 resources for verification
  - apiGroups: ["compute.azure.com", "network.azure.com"]
    resources: ["virtualmachines", "networkinterfaces", "publicipaddresses"]
    verbs: ["get", "list", "watch"]
  # Allow reading ConfigMaps (for workflow context)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-api-role
subjects:
  - kind: ServiceAccount
    name: platform-api-user
    namespace: azureserviceoperator-system
---
# Example: Create a long-lived token secret (Kubernetes 1.24+)
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-token
  namespace: azureserviceoperator-system
  annotations:
    kubernetes.io/service-account.name: platform-api-user
type: kubernetes.io/service-account-token
