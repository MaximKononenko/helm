apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: vm-minimal-traits
  namespace: azureserviceoperator-system
spec:
  components:
    - name: vm
      type: azure-vm
      properties:
        vmName: "vm-traits-minimal-01"
        vmSize: "small"
        environment: "dev"
        resourceGroup: "rg-tst-eastus-istio-compute"
        subscriptionId: "a50f971b-376d-4d05-ac33-1e9fcfb8f32c"
        location: "eastus"
        network:
          vnetResourceGroup: "rg-np-eastus-dashboard"
          vnetName: "vn-np-eastus-10-166-54-0-24"
          subnetName: "sn-tst-eastus-istio-10-166-54-0-26-aks-b"
        tags:
          Owner: "developer-john"
          Purpose: "testing"
      # Only cost tracking (minimal compliance)
      traits:
        - type: cost-tracking
          properties:
            costCenter: "DEV-002"
            department: "Development"
            project: "feature-test"
