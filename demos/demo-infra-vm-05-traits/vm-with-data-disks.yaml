apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: vm-with-disks
  namespace: azureserviceoperator-system
spec:
  components:
    - name: vm
      type: azure-vm
      properties:
        vmName: "vm-disks-demo-01"
        vmSize: "medium"
        environment: "dev"
        resourceGroup: "rg-tst-eastus-istio-compute"
        subscriptionId: "a50f971b-376d-4d05-ac33-1e9fcfb8f32c"
        location: "eastus"
        network:
          vnetResourceGroup: "rg-tst-eastus-istio-network"
          vnetName: "vn-tst-eastus-istio"
          subnetName: "sn-tst-eastus-istio-aks"
        tags:
          Owner: "database-team"
          Purpose: "postgresql-server"
        
        # Reference data disks to attach (automatically attached during VM creation)
        dataDisks:
          - name: vm-disks-demo-01-data-db
            caching: ReadWrite  # Database workload
          - name: vm-disks-demo-01-data-logs
            caching: None       # Log files don't benefit from caching
      # Attach traits
      traits:
        # Cost tracking
        - type: cost-tracking
          properties:
            costCenter: "ENG-001"
            department: "Engineering"
            project: "database-migration"
        # Backup policy for database VM
        - type: backup-policy
          properties:
            enabled: "true"
            retentionDays: 90 # Longer retention for databases
            schedule: "0 */6 * * *" # Every 6 hours
            vaultName: "backup-vault-databases"
        # Security baseline
        - type: security-baseline
          properties:
            securityLevel: "confidential"
            complianceFramework: "sox"
            dataClassification: "confidential"
            patchingSchedule: "weekly"
    # Additional component: Data Disk 1 (Database)
    - name: data-disk-db
      type: raw
      properties:
        apiVersion: compute.azure.com/v1api20240302
        kind: Disk
        metadata:
          name: vm-disks-demo-01-data-db
          namespace: azureserviceoperator-system
          annotations:
            serviceoperator.azure.com/credential-from: aso-credential-catalina-vault-sqa
        spec:
          azureName: vm-disks-demo-01-data-db
          location: eastus
          owner:
            armId: /subscriptions/a50f971b-376d-4d05-ac33-1e9fcfb8f32c/resourceGroups/rg-tst-eastus-istio-compute
          sku:
            name: Premium_LRS
          diskSizeGB: 256
          creationData:
            createOption: Empty
          tags:
            Owner: database-team
            Purpose: postgresql-data
            DiskType: database
            ManagedBy: kubevela
            CostCenter: ENG-001
            Department: Engineering
            Project: database-migration
          operatorSpec: {}
    # Additional component: Data Disk 2 (Logs)
    - name: data-disk-logs
      type: raw
      properties:
        apiVersion: compute.azure.com/v1api20240302
        kind: Disk
        metadata:
          name: vm-disks-demo-01-data-logs
          namespace: azureserviceoperator-system
          annotations:
            serviceoperator.azure.com/credential-from: aso-credential-catalina-vault-sqa
        spec:
          azureName: vm-disks-demo-01-data-logs
          location: eastus
          owner:
            armId: /subscriptions/a50f971b-376d-4d05-ac33-1e9fcfb8f32c/resourceGroups/rg-tst-eastus-istio-compute
          sku:
            name: StandardSSD_LRS # Cheaper for logs
          diskSizeGB: 128
          creationData:
            createOption: Empty
          tags:
            Owner: database-team
            Purpose: postgresql-logs
            DiskType: logs
            ManagedBy: kubevela
            CostCenter: ENG-001
            Department: Engineering
            Project: database-migration
          operatorSpec: {}
