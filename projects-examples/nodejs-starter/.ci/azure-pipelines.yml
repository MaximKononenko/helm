# Azure DevOps Pipeline - {{PROJECT_NAME}}
# Generated by ops-box self-service wizard
# Service: {{SERVICE_NAME}}

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - {{SERVICE_NAME}}/**
      - .ci/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20'
  serviceName: '{{SERVICE_NAME}}'
  projectName: '{{PROJECT_NAME}}'
  containerRegistry: 'catalina.azurecr.io'
  imageRepository: '$(projectName)/$(serviceName)'
  dockerfilePath: '$(Build.SourcesDirectory)/$(serviceName)/Dockerfile'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build {{SERVICE_NAME}}'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '$(nodeVersion)'
            displayName: 'Use Node.js $(nodeVersion)'

          - script: |
              cd $(serviceName)
              npm ci
            displayName: 'Install dependencies'

          - script: |
              cd $(serviceName)
              npm run build
            displayName: 'Build application'

          - script: |
              cd $(serviceName)
              npm test
            displayName: 'Run tests'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(containerRegistry)
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push Docker image'
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(containerRegistry)
              tags: |
                $(Build.BuildId)
                latest
