# Timoni Values - {{PROJECT_NAME}}/{{SERVICE_NAME}}
# Generated by ops-box self-service wizard

metadata:
  name: {{SERVICE_NAME}}
  namespace: {{NAMESPACE}}

image:
  repository: catalina.azurecr.io/{{PROJECT_NAME}}/{{SERVICE_NAME}}
  tag: latest
  pullPolicy: Always

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: {{SERVICE_NAME}}.{{PROJECT_NAME}}.example.com
  tls:
    enabled: true
    secretName: {{SERVICE_NAME}}-tls

healthCheck:
  liveness:
    path: /health
    port: 8000
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /ready
    port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10

env:
  - name: ENVIRONMENT
    value: "{{ENVIRONMENT}}"
  - name: LOG_LEVEL
    value: "INFO"
  - name: PORT
    value: "8000"
