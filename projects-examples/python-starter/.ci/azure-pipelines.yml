# Azure DevOps Pipeline - {{PROJECT_NAME}}
# Generated by ops-box self-service wizard
# Service: {{SERVICE_NAME}}

name: $(Build.SourceBranchName).$(Build.BuildId)
pr: none
pool: vmss-pr-eastus2-ado-cmp
trigger:
  batch: true
  branches:
    include:
      - main
      - develop
variables:
  - group: devops-credentials
  - group: ACR Catalina
  - name: pythonVersion
    value: '{{PYTHON_VERSION}}'
  - name: serviceName
    value: '{{SERVICE_NAME}}'
  - name: projectName
    value: '{{PROJECT_NAME}}'
  - name: containerRegistry
    value: 'Catalina ACR'
  - name: containerRegistryFullName
    value: 'catalina.azurecr.io'
  - name: dockerFile
    value: 'Dockerfile'
  - name: context
    value: '{{SERVICE_NAME}}'
stages:
  - stage: Build
    displayName: CI
    jobs:
      - job: kaniko_build
        displayName: Kaniko Build & Push
        steps:
          - task: Bash@3
            displayName: Set Build Variables
            inputs:
              targetType: inline
              script: |-
                service="$(serviceName)"
                echo "##vso[task.setvariable variable=service;isOutput=false]$service"

                acrRepoName="$(projectName)"
                echo "##vso[task.setvariable variable=acrRepoName;isOutput=false]$acrRepoName"

                dockerFile="$(dockerFile)"
                echo "##vso[task.setvariable variable=dockerFile;isOutput=false]$dockerFile"

                buildTag="$(echo $(basename $(Build.SourceBranch)).$(build.buildId) | tr '[:upper:]' '[:lower:]')"
                echo "##vso[task.setvariable variable=buildTag;isOutput=false]$buildTag"

                imageTag="$(containerRegistryFullName)/$(projectName)/$(serviceName):$buildTag"
                echo "##vso[task.setvariable variable=imageTag;isOutput=false]$imageTag"

                context="$(context)"
                echo "##vso[task.setvariable variable=context;isOutput=false]$context"

                echo "=== Build Variables ==="
                echo "service: $service"
                echo "acrRepoName: $acrRepoName"
                echo "dockerFile: $dockerFile"
                echo "buildTag: $buildTag"
                echo "imageTag: $imageTag"
                echo "context: $context"
          - task: Bash@3
            displayName: Kaniko Build & Push
            inputs:
              targetType: inline
              script: |
                echo "Running Kaniko Build & Push for $(serviceName)"
                mkdir -p $(Pipeline.Workspace)/.kaniko-docker
                echo "{\"auths\":{\"$(containerRegistryFullName)\":{\"username\":\"$(global.acrUsername)\",\"password\":\"$(global.acrPasswd)\"}}}" > $(Pipeline.Workspace)/.kaniko-docker/config.json

                docker login $(containerRegistryFullName) -u $(global.acrUsername) -p $(global.acrPasswd)
                docker pull $(containerRegistryFullName)/kaniko/executor:latest

                echo "Starting Kaniko build with Dockerfile: $(dockerFile)"
                docker run --rm \
                  -v $(Pipeline.Workspace)/s:/workspace \
                  -v $(Pipeline.Workspace)/.kaniko-docker:/kaniko/.docker \
                  $(containerRegistryFullName)/kaniko/executor:v1.23.1 \
                  --context=$(context) \
                  --dockerfile=$(dockerFile) \
                  --destination=$(imageTag)
            name: kanikoOutput
  - stage: Deploy
    displayName: CD
    dependsOn: Build
    condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/release-'))
    variables:
      buildTag: $[ stageDependencies.Build.kaniko_build.outputs['kanikoOutput.buildTag'] ]
    jobs:
      - job: deploy
        displayName: Deploy to Kubernetes
        container:
          image: catalina.azurecr.io/ops-box/timoni-cd:latest
          endpoint: Catalina ACR
          options: --user root
        steps:
          - checkout: self
          - task: Bash@3
            displayName: Determine Environment and Context
            inputs:
              targetType: inline
              script: |-
                # Set kubeconfig path
                export KUBECONFIG=/workspace/.kube/config

                # Determine environment based on branch/tag
                if [[ "$(Build.SourceBranch)" == "refs/heads/main" ]]; then
                  ENVIRONMENT="dev"
                  NAMESPACE_SUFFIX="dev"
                elif [[ "$(Build.SourceBranch)" =~ ^refs/tags/release-.* ]]; then
                  ENVIRONMENT="prd"
                  NAMESPACE_SUFFIX="prd"
                else
                  echo "Unknown branch/tag pattern, skipping deployment"
                  exit 1
                fi

                # Determine k8s context based on ADO project
                ADO_PROJECT="$(System.TeamProject)"
                if [[ "$ADO_PROJECT" == "CMP" ]]; then
                  if [[ "$ENVIRONMENT" == "dev" ]]; then
                    K8S_CONTEXT="aks-np-eastus-cmp-admin"
                  else
                    K8S_CONTEXT="aks-prd-eastus2-cmp-admin"
                  fi
                elif [[ "$ADO_PROJECT" == "Catalina_AI" ]]; then
                  K8S_CONTEXT="aks-prd-eastus2-n8n-admin"
                else
                  echo "Unknown ADO project: $ADO_PROJECT"
                  exit 1
                fi

                echo "=== Deployment Configuration ==="
                echo "Environment: $ENVIRONMENT"
                echo "Namespace: $(projectName)-$NAMESPACE_SUFFIX"
                echo "K8s Context: $K8S_CONTEXT"
                echo "Image Tag: $(buildTag)"

                # Export as pipeline variables
                echo "##vso[task.setvariable variable=ENVIRONMENT]$ENVIRONMENT"
                echo "##vso[task.setvariable variable=K8S_CONTEXT]$K8S_CONTEXT"
                echo "##vso[task.setvariable variable=IMAGE_TAG]$(buildTag)"
          - task: Bash@3
            displayName: Deploy with Timoni
            inputs:
              targetType: inline
              script: |-
                export KUBECONFIG=/workspace/.kube/config
                cd $(Build.SourcesDirectory)/.ci

                echo "Switching to k8s context: $(K8S_CONTEXT)"
                kubectl config use-context $(K8S_CONTEXT)

                echo "Deploying $(projectName) to $(ENVIRONMENT) environment"
                echo "Image tag: $(IMAGE_TAG)"

                # Create runtime values file
                cat > runtime.yaml << EOF
                runtime:
                  name: "$(ENVIRONMENT)"
                global:
                  image:
                    tag: "$(IMAGE_TAG)"
                EOF

                # Apply Timoni bundle
                timoni bundle apply \
                  -f timoni-bundle.cue \
                  -f runtime.yaml \
                  --kube-context $(K8S_CONTEXT)

                echo "Deployment completed successfully"
          - task: Bash@3
            displayName: Verify Deployment
            inputs:
              targetType: inline
              script: |-
                export KUBECONFIG=/workspace/.kube/config

                echo "Waiting for deployment to be ready..."
                kubectl wait --for=condition=available \
                  --timeout=300s \
                  deployment/$(projectName)-$(serviceName) \
                  -n $(projectName)-$(ENVIRONMENT)

                echo "Deployment verification completed"
                kubectl get pods -n $(projectName)-$(ENVIRONMENT) -l app=$(projectName)-$(serviceName)
