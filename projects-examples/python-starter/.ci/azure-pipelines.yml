# Azure DevOps Pipeline - {{PROJECT_NAME}}
# Generated by ops-box self-service wizard
# Service: {{SERVICE_NAME}}

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - {{SERVICE_NAME}}/**
      - .ci/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  serviceName: '{{SERVICE_NAME}}'
  projectName: '{{PROJECT_NAME}}'
  containerRegistry: 'catalina.azurecr.io'
  imageRepository: '$(projectName)/$(serviceName)'
  dockerfilePath: '$(Build.SourcesDirectory)/$(serviceName)/Dockerfile'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildJob
        displayName: 'Build {{SERVICE_NAME}}'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              cd $(serviceName)
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              cd $(serviceName)
              pytest tests/ -v --junitxml=test-results.xml --cov=src --cov-report=xml
            displayName: 'Run tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: '$(serviceName)/test-results.xml'
              testRunTitle: 'Python $(pythonVersion) Tests'

          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: build
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(containerRegistry)
              tags: |
                $(Build.BuildId)
                latest

          - task: Docker@2
            displayName: 'Push Docker image'
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(containerRegistry)
              tags: |
                $(Build.BuildId)
                latest

  - stage: Deploy
    displayName: 'Deploy to Kubernetes'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployJob
        displayName: 'Deploy {{SERVICE_NAME}}'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@0
                  displayName: 'Deploy to AKS'
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'aks-connection'
                    namespace: '{{NAMESPACE}}'
                    manifests: |
                      $(Pipeline.Workspace)/.ci/k8s-manifests/*.yaml
