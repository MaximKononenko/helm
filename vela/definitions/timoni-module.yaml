apiVersion: core.oam.dev/v1beta1
kind: ComponentDefinition
metadata:
  name: timoni-module
  namespace: vela-system
spec:
  workload:
    definition:
      apiVersion: batch/v1
      kind: Job
  schematic:
    cue:
      template: |
        import (
          "encoding/json"
        )

        output: {
          apiVersion: "batch/v1"
          kind:       "Job"
          spec: {
            backoffLimit: 3
            ttlSecondsAfterFinished: 3600
            template: {
              spec: {
                restartPolicy: "OnFailure"
                serviceAccountName: "vela-timoni-runner"
                containers: [{
                  name:  "timoni"
                  image: "catalina.azurecr.io/timoni:v0.23.0-alpine"
                  command: ["/bin/sh", "-c"]
                  args: [
                    "cat > values.cue <<'EOF'\n" +
                    "values: " + json.Marshal(parameter.values) + "\n" +
                    "EOF\n" +
                    "cat values.cue && " +
                    "timoni apply " + context.name + " " + parameter.url + " --version " + parameter.version + " --values values.cue --namespace " + context.namespace + " --wait"
                  ]
                  env: [
                    {
                      name: "HOME"
                      value: "/tmp"
                    },
                    {
                      name: "DOCKER_CONFIG"
                      value: "/tmp/.docker"
                    },
                    if parameter.kubeconfigSecret != _|_ {
                      {
                        name: "KUBECONFIG"
                        value: "/mnt/kubeconfig/kubeconfig"
                      }
                    }
                  ]
                  volumeMounts: [
                    {
                      name: "docker-config"
                      mountPath: "/tmp/.docker"
                      readOnly: true
                    },
                    if parameter.kubeconfigSecret != _|_ {
                      {
                        name: "kubeconfig"
                        mountPath: "/mnt/kubeconfig"
                        readOnly: true
                      }
                    }
                  ]
                }]
                volumes: [
                  {
                    name: "docker-config"
                    secret: {
                      secretName: "acr-catalina"
                      items: [{
                        key: ".dockerconfigjson"
                        path: "config.json"
                      }]
                    }
                  },
                  if parameter.kubeconfigSecret != _|_ {
                    {
                      name: "kubeconfig"
                      secret: {
                        secretName: parameter.kubeconfigSecret
                      }
                    }
                  }
                ]
              }
            }
          }
        }

        parameter: {
          url: string
          version: string
          values: {...}
          kubeconfigSecret?: string
        }
